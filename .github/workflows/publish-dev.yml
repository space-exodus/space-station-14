name: Publish Dev

concurrency:
  group: publish-dev
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
#    - name: Install dependencies
#      run: sudo apt-get install -y python3-paramiko python3-lxml

    - uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'

    # Exodus-Secrets-Start
    - name: Setup secrets
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      if: ${{ env.ACCESS_TOKEN != '' }}
      run: |
        git -c submodule.Secrets.update=checkout -c submodule.Secrets.url="https://${{ env.ACCESS_TOKEN }}@github.com/space-exodus/secrets.git" submodule update --init
        ./sync-secrets.sh
    # Exodus-Secrets-End

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 9.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 # --platform osx-x64 --platform linux-arm64 # we don't need them

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN_DEV }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
        FORK_ID: exodus-dev
        ROBUST_CDN_URL: ${{ secrets.ROBUST_CDN_URL }}
