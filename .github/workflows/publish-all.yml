name: Publish All

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  trigger-main:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Publish Main
      run: |
        curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish-main.yml/dispatches \
          -d '{"ref":"master"}'

  trigger-public:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Publish Public
      run: |
        curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish-public.yml/dispatches \
          -d '{"ref":"master"}'
